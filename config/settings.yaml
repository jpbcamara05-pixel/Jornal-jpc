# Configuração geral do briefing. Segredos ficam no .env, nunca aqui.

timezone: America/Sao_Paulo
run_at: "06:30"          # coleta começa aqui; entrega prevista ~06:45
lookback_hours: 26       # janela de coleta (cobre a edição impressa de ontem à noite)
dcm_lookback_days: 3          # ofertas 160, B3, Vórtx
dcm_ipe_lookback_days: 8      # CSV do IPE da CVM sai com ~3–5 dias de atraso
dedup_window_days: 3     # não repetir história já enviada nos últimos N dias

# Perfil do leitor — injetado nos prompts de ranking e síntese.
# Mudar aqui muda o que é considerado "principal" sem mexer em código.
reader_profile: |
  Profissional do mercado financeiro brasileiro, atuando em DCM (mercado de
  capitais de dívida: debêntures, CRI, CRA, notas comerciais, FIDC, bonds).
  Prioridade: Brasil > internacional. Interesses em ordem: empresas emissoras e
  seus resultados/captações/M&A; juros, inflação, fiscal e Copom; regulação de
  mercado de capitais (CVM, CMN, B3, ANBIMA, tributação de incentivadas);
  política com efeito econômico; cenário global que afete Treasuries, dólar,
  commodities e apetite a risco em emergentes. Pouco interesse: esportes,
  cultura, celebridades, política sem efeito econômico.

llm:
  model: claude-opus-5-5
  effort: high
  max_tokens: 16000
  # Modelo mais barato para tarefas em massa (classificar 300 artigos, extrair sinais DCM)
  bulk_model: claude-haiku-5-5

curation:
  max_articles_to_llm: 120     # após dedup/heurística; o resto nem vai ao LLM
  min_per_source: 8            # piso por veículo (FT/WSJ/NYT/BJ) mesmo que o ranking os deixe fora do top
  weights:
    prominence: 0.35           # capa / impresso / top stories
    cross_coverage: 0.20
    profile_relevance: 0.35    # pontuação LLM 0..1
    recency: 0.10
  per_topic_cards:
    mercado_empresas: 6
    economia: 4
    politica: 3
    internacional: 4

pdf:
  page_size: phone             # phone (420×760 pt, 1 coluna, corpo 14 pt) | A4 (2 colunas)
  template_briefing: briefing.html
  template_dcm: dcm.html

audio:
  words_per_minute: 150
  format: ogg_opus             # nota de voz no WhatsApp (libopus mono, ~24 kbps, application voip)
  opus_bitrate: 24k            # ≤ ~700 KB em 4 min; abaixo de 20k fica < 512 KB (limite de preview na Cloud API)
  # provedor em .env TTS_PROVIDER: edge (grátis, dev) | google (Chirp 3 HD, 1M chars/mês grátis, recomendado) | openai | elevenlabs
  channels:
    - mercado_empresas
    - economia
    - politica

delivery:
  send_text_opener: true
  order: [text, briefing_pdf, audio_mercado, audio_economia, audio_politica, dcm_pdf]
  retry_attempts: 3
